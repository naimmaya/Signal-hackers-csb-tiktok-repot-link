<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1626"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#neonGreen)" stroke-width="8" opacity="0.4"/>

  <!-- Shield Shape -->
  <path d="M256 80 L380 140 V260 C380 340 256 420 256 420 C256 420 132 340 132 260 V140 Z" 
        fill="#090d16" 
        stroke="url(#neonGreen)" 
        stroke-width="12" 
        stroke-linejoin="round"/>

  <!-- Terminal Prompt Symbol >_ inside shield -->
  <path d="M190 200 L245 250 L190 300" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <line x1="265" y1="300" x2="320" y2="300" 
        stroke="#38bdf8" 
        stroke-width="18" 
        stroke-linecap="round"/>

  <!-- Subtitle Text -->
  <text x="256" y="468" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#10b981">
    SIGNAL HACKERS
  </text>
</svg>
